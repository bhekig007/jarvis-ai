<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connecting X | Jarvis AI</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #101319; background: #f4efe5; }
    .card { width: min(660px, calc(100vw - 32px)); background: #fff; border: 1px solid #d9ded9; border-radius: 8px; padding: 28px; box-shadow: 0 18px 45px rgba(22,25,30,.12); }
    a { color: #1264a3; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .error { color: #a33d32; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Connecting X</h1>
    <p id="message">Finishing authorization...</p>
    <p><a href="./x.html">Return to Connect X</a></p>
  </main>

  <script>
    const CONFIG_KEY = "jarvisXClientId";
    const TOKEN_KEY = "jarvisXToken";
    const VERIFIER_KEY = "jarvisXCodeVerifier";
    const STATE_KEY = "jarvisXOAuthState";
    const RETURN_KEY = "jarvisXReturnTo";
    const REDIRECT_URI = `${location.origin}${location.pathname}`;

    const qs = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");

    function fail(message) {
      qs("#message").innerHTML = `<span class="error">${escapeHtml(message)}</span>`;
      const returnTo = sessionStorage.getItem(RETURN_KEY) || "./x.html";
      setTimeout(() => { location.href = `${returnTo}?x_error=${encodeURIComponent(message)}`; }, 2200);
    }

    async function exchangeCode() {
      const params = new URLSearchParams(location.search);
      const error = params.get("error") || params.get("error_description");
      if (error) return fail(error);

      const code = params.get("code");
      const state = params.get("state");
      const expectedState = sessionStorage.getItem(STATE_KEY);
      const verifier = sessionStorage.getItem(VERIFIER_KEY);
      const clientId = localStorage.getItem(CONFIG_KEY);
      const returnTo = sessionStorage.getItem(RETURN_KEY) || "./x.html";

      if (!code) return fail("X did not return an authorization code.");
      if (!state || state !== expectedState) return fail("OAuth state did not match. Start the X connection again.");
      if (!verifier) return fail("Missing PKCE verifier. Start the X connection again from the same browser tab.");
      if (!clientId) return fail("Missing Client ID. Save it in Connect X first.");

      try {
        const body = new URLSearchParams({
          grant_type: "authorization_code",
          client_id: clientId,
          redirect_uri: REDIRECT_URI,
          code_verifier: verifier,
          code
        });
        const response = await fetch("https://api.x.com/2/oauth2/token", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error_description || data.detail || data.error || "Token exchange failed.");
        data.saved_at = Date.now();
        localStorage.setItem(TOKEN_KEY, JSON.stringify(data));
        sessionStorage.removeItem(VERIFIER_KEY);
        sessionStorage.removeItem(STATE_KEY);
        qs("#message").textContent = "X connected. Returning to Jarvis...";
        location.href = `${returnTo}?connected=1`;
      } catch (error) {
        fail(`${error.message}. If this is a browser network error, GitHub Pages may need a small backend proxy for X token exchange.`);
      }
    }

    exchangeCode();
  </script>
</body>
</html>
